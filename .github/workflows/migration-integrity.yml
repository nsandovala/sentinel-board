name: Migration integrity
on:
  pull_request:
permissions:
  contents: read
jobs:
  disposable-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:check
      - run: npm run test:migrations
